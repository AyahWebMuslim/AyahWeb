    <div class="container">
        <h1>إتمام عملية الشراء</h1>
        <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="759c5ea3-96ca-4b21-9af2-dd2675ebd4dd">
            <input type="hidden" name="subject" value="Nouvelle commande sur AyahWeb !">

            <label>الاسم الكامل</label>
            <input type="text" name="nom_complet" placeholder="أدخل اسمك الكامل" required>

            <label>رقم الهاتف</label>
            <input type="tel" name="telephone" placeholder="05xxxxxxxx" required>

            <label>البريد الإلكتروني</label>
            <input type="email" name="email">

            <label>الولاية</label>
            <input type="text" name="wilaya" placeholder=" مثال : الجزائر العاصمة">

            <label>عنوان التوصيل</label>
            <textarea name="adresse" placeholder="أدخل عنوانك بالتفصيل"></textarea>
            <label>طريقة الدفع</label>
<select id="paiement" name="mode_paiement">
    <option value="cod">الدفع عند الاستلام (التوصيل للمنزل)</option>
    <option value="store">الاستلام من المحل (تأتي بنفسك)</option>
</select>
<input type="hidden" name="produits" id="produits">     
            <button type="submit">تأكيد الطلب</button>
        </form>

</footer>
<script>
const panier = JSON.parse(localStorage.getItem("panier")) || [];

let texteCommande = "";

panier.forEach((produit, index) => {
    texteCommande += (index + 1) + ". " + produit.texte + "\n";
});

document.getElementById("produits").value = texteCommande;
</script>
